   <g id="text_34">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: middle" x="576" y="548.735" transform="rotate(-0 576 548.735)">Takeaway: CE-based models are competitive; adding SupCon did not consistently improve these runs.</text>
