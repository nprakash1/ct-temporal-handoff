   </g>
   <g id="text_20">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: middle" x="576" y="551.615" transform="rotate(-0 576 551.615)">Last-block experiment: CE + change/stable BCE + paired cosine alignment (no SupCon).</text>
   </g>
   <g id="text_21">
    <text style="fill: #516276; font: 11px 'DejaVu Sans'; text-anchor: start" x="61.2" y="607.835312" transform="rotate(-0 61.2 607.835312)">Cosine alignment pulls toward one target without a contrastive denominator. BCE predicts changed vs stable, not physical size.</text>
