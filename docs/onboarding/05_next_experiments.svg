   <g id="text_1">
    <text style="fill: #172b43; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.8" y="54.144844" transform="rotate(-0 46.8 54.144844)">Next: a controlled CT progression study</text>
   </g>
   <g id="text_2">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="46.8" y="90.539062" transform="rotate(-0 46.8 90.539062)">Change one factor at a time. Match examples, prototypes, seeds, sampling, and evaluation.</text>
   </g>
   <g id="text_3">
    <text style="fill: #516276; font: 10px 'DejaVu Sans'; text-anchor: start" x="46.8" y="630.482188" transform="rotate(-0 46.8 630.482188)">3dCT  |  Finding-specific longitudinal progression</text>
   </g>
   <g id="text_4">
    <text style="fill: #516276; font: 11px 'DejaVu Sans'; text-anchor: end" x="1105.2" y="630.875312" transform="rotate(-0 1105.2 630.875312)">05</text>
   </g>
   <g id="text_5">
    <text style="fill: #172b43; font: 22px 'DejaVu Sans'; text-anchor: middle" x="97.2" y="203.350625" transform="rotate(-0 97.2 203.350625)">01</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b43; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="151.2" y="185.242813" transform="rotate(-0 151.2 185.242813)">Validate the benchmark</text>
   </g>
   <g id="text_7">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="151.2" y="217.259063" transform="rotate(-0 151.2 217.259063)">Check labels + exact prior-study correspondence; review an image-based gold subset.</text>
   </g>
   <g id="text_8">
    <text style="fill: #172b43; font: 22px 'DejaVu Sans'; text-anchor: middle" x="97.2" y="286.870625" transform="rotate(-0 97.2 286.870625)">02</text>
   </g>
   <g id="text_9">
    <text style="fill: #172b43; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="151.2" y="268.762812" transform="rotate(-0 151.2 268.762812)">Prove both scans matter</text>
   </g>
   <g id="text_10">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="151.2" y="300.779063" transform="rotate(-0 151.2 300.779063)">Compare finding-only, current-only, prior-only, subtraction, and a paired adapter.</text>
   </g>
   <g id="text_11">
    <text style="fill: #172b43; font: 22px 'DejaVu Sans'; text-anchor: middle" x="97.2" y="370.390625" transform="rotate(-0 97.2 370.390625)">03</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b43; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="151.2" y="352.208594" transform="rotate(-0 151.2 352.208594)">Isolate the training signal</text>
   </g>
   <g id="text_13">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="151.2" y="384.299062" transform="rotate(-0 151.2 384.299062)">Matched CE / change BCE / cosine / SupCon runs; choose settings on tune data.</text>
   </g>
   <g id="text_14">
    <text style="fill: #172b43; font: 22px 'DejaVu Sans'; text-anchor: middle" x="97.2" y="453.910625" transform="rotate(-0 97.2 453.910625)">04</text>
   </g>
   <g id="text_15">
    <text style="fill: #172b43; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="151.2" y="435.728594" transform="rotate(-0 151.2 435.728594)">Verify image fine-tuning</text>
   </g>
   <g id="text_16">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="151.2" y="467.819062" transform="rotate(-0 151.2 467.819062)">Repair VQ gradient path; confirm nonzero gradients and actual visual-weight updates.</text>
   </g>
   <g id="text_17">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(173.8125 534.885879)">Later: EXACT backbone comparison</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(104.90625 553.392246)">Account for preprocessing and text-space differences.</text>
   </g>
   <g id="text_18">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(648.568359 534.885879)">Later: spatial grounding + acquisition robustness</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(638.337891 553.392246)">Audit scanner/kernel effects before adding BiasCon.</text>
   </g>
   <g id="text_19">
    <text style="fill: #516276; font: 12px 'DejaVu Sans'; text-anchor: start" x="61.2" y="605.95125" transform="rotate(-0 61.2 605.95125)">Final evidence: patient-level uncertainty, per-finding results, and preferably an additional untouched evaluation set.</text>
   </g>
