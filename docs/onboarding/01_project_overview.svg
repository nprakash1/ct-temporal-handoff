   </g>
   <g id="text_9">
    <text style="fill: #172b43; font: 19px 'DejaVu Sans'" transform="translate(901.66875 248.201414)">WORSENED</text>
    <text style="fill: #172b43; font: 19px 'DejaVu Sans'" transform="translate(922.190234 271.642813)">STABLE</text>
