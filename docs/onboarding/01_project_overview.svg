   <g id="text_13">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'" transform="translate(91.68625 502.144937)">CheXTemporal: 5-class progression + spatial grounding</text>
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'" transform="translate(144.4975 521.885063)">New / worse / stable / improved / resolved</text>
   </g>
   <g id="text_14">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'" transform="translate(687.4075 502.144937)">Current CT scope: 3-class progression</text>
