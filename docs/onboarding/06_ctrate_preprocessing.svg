   <g id="text_1">
    <text style="fill: #172b43; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.8" y="54.250313" transform="rotate(-0 46.8 54.250313)">CT-RATE: from chest CT + reports to temporal inputs</text>
   </g>
   <g id="text_2">
    <text style="fill: #516276; font: 15px 'DejaVu Sans'; text-anchor: start" x="46.8" y="90.539062" transform="rotate(-0 46.8 90.539062)">Two preparation tracks: build valid longitudinal examples, then standardize each scan for CT-CLIP.</text>
   </g>
   <g id="text_3">
    <text style="fill: #516276; font: 10px 'DejaVu Sans'; text-anchor: start" x="46.8" y="630.482188" transform="rotate(-0 46.8 630.482188)">3dCT  |  Finding-specific longitudinal progression</text>
   </g>
   <g id="text_4">
    <text style="fill: #516276; font: 11px 'DejaVu Sans'; text-anchor: end" x="1105.2" y="630.875312" transform="rotate(-0 1105.2 630.875312)">06</text>
   </g>
   <g id="text_5">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="75.6" y="173.063125" transform="rotate(-0 75.6 173.063125)">THE SOURCE DATA</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b43; font: 700 18px 'DejaVu Sans'" transform="translate(75.6 206.192742)">Non-contrast 3D chest CTs</text>
    <text style="fill: #172b43; font: 700 18px 'DejaVu Sans'" transform="translate(75.6 228.400383)">Radiology reports + metadata</text>
   </g>
   <g id="text_7">
    <text style="fill: #516276; font: 14px 'DejaVu Sans'" transform="translate(75.6 265.950516)">Local audit: 50,188 volume/report rows</text>
    <text style="fill: #516276; font: 14px 'DejaVu Sans'" transform="translate(75.6 283.223125)">21,304 patients</text>
    <text style="fill: #516276; font: 14px 'DejaVu Sans'" transform="translate(75.6 300.495734)">Multiple reconstructions per study</text>
   </g>
   <g id="text_8">
    <text style="fill: #287a57; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="468" y="168.023125" transform="rotate(-0 468 168.023125)">OUR TEMPORAL DATASET CONSTRUCTION</text>
   </g>
   <g id="text_9">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: start" x="468" y="211.775" transform="rotate(-0 468 211.775)">1  Choose one reconstruction per study; order by StudyDate.</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: start" x="468" y="245.615" transform="rotate(-0 468 245.615)">2  Pair consecutive studies; drop same-day / missing-date pairs.</text>
   </g>
   <g id="text_11">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: start" x="468" y="279.455" transform="rotate(-0 468 279.455)">3  Use Findings + Impressions for report-derived direction labels.</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b43; font: 16px 'DejaVu Sans'; text-anchor: start" x="468" y="313.295" transform="rotate(-0 468 313.295)">4  Keep eligible findings; split by patient into train / tune / test.</text>
   </g>
   <g id="text_13">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="61.2" y="372.503125" transform="rotate(-0 61.2 372.503125)">CT-CLIP VOLUME PREPROCESSING  •  APPLY INDEPENDENTLY TO PRIOR AND CURRENT</text>
   </g>
   <g id="text_14">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: middle" x="178.2" y="426.503125" transform="rotate(-0 178.2 426.503125)">LOAD NIfTI</text>
   </g>
   <g id="text_15">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(118.289063 453.632695)">Read intensities</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(118.464844 472.139063)">+ voxel spacing</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(117.251953 490.64543)">from the header</text>
   </g>
   <g id="text_16">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: middle" x="448.2" y="426.503125" transform="rotate(-0 448.2 426.503125)">WINDOW + SCALE</text>
   </g>
   <g id="text_17">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(357.342188 453.632695)">Clip: −1000 to +200 HU</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(379.069922 472.139063)">Linearly normalize</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(411.839063 490.64543)">to [−1, 1]</text>
   </g>
   <g id="text_18">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: middle" x="718.2" y="426.503125" transform="rotate(-0 718.2 426.503125)">RESAMPLE</text>
   </g>
   <g id="text_19">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(633.775781 453.632695)">0.75 × 0.75 × 1.5 mm</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(684.945703 472.139063)">(x / y / z)</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(644.635547 490.64543)">Linear interpolation</text>
   </g>
   <g id="text_20">
    <text style="fill: #2469a0; font: 700 14px 'DejaVu Sans'; text-anchor: middle" x="988.2" y="426.503125" transform="rotate(-0 988.2 426.503125)">CENTER CROP / PAD</text>
   </g>
   <g id="text_21">
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(923.149219 453.632695)">480 × 480 × 240</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(948.929297 472.139063)">(H / W / D)</text>
    <text style="fill: #172b43; font: 15px 'DejaVu Sans'" transform="translate(935.820703 490.64543)">Pad value: −1</text>
   </g>
   <g id="text_22">
    <text style="fill: #172b43; font: 14px 'DejaVu Sans'; text-anchor: middle" x="583.2" y="560.979063" transform="rotate(-0 583.2 560.979063)">Input: (B, 1, 240, 480, 480) | Frozen adapter: cache 512-D vectors | Last-block: cache prefixes</text>
   </g>
   <g id="text_23">
    <text style="fill: #516276; font: 11px 'DejaVu Sans'; text-anchor: start" x="61.2" y="608.555313" transform="rotate(-0 61.2 608.555313)">Silver labels, not image-verified gold. No scan registration; exact report-to-prior correspondence still needs verification.</text>
   </g>
  </g>
 </g>
